<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С 1 апреля!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Comic Sans MS', system-ui, sans-serif;
    background: #000;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }
  h1 {
    font-size: clamp(28px, 7vw, 64px);
    color: #ff0000;
    text-shadow: 0 0 10px #ff0000, 0 0 30px #ff0000;
    margin-bottom: 24px;
    animation: bounce 1.5s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .april {
    font-size: clamp(20px, 5vw, 40px);
    color: #ff0000;
    background: #1a0000;
    padding: 12px 28px;
    border: 2px solid #ff0000;
    border-radius: 999px;
    margin-bottom: 34px;
    text-shadow: 0 0 8px #ff0000;
    box-shadow: 0 0 20px #ff0000;
  }
  button {
    font-size: clamp(18px, 4vw, 28px);
    font-family: inherit;
    padding: 16px 44px;
    border: 2px solid #ff0000;
    border-radius: 999px;
    background: #000;
    color: #ff0000;
    cursor: pointer;
    font-weight: bold;
    text-shadow: 0 0 8px #ff0000;
    box-shadow: 0 0 20px #ff0000, inset 0 0 15px rgba(255,0,0,.4);
    transition: transform .1s, box-shadow .1s, background .1s;
  }
  button:hover {
    background: #ff0000;
    color: #000;
    text-shadow: none;
  }
  button:active {
    transform: translateY(4px);
  }
  .thanks {
    font-size: clamp(22px, 5vw, 42px);
    color: #ff0000;
    text-shadow: 0 0 12px #ff0000, 0 0 30px #ff0000;
    display: none;
  }
  .emoji { font-size: 1.3em; }
</style>
</head>
<body>
  <h1>Андрей Чижов <span class="emoji">🤡</span></h1>
  <div class="april">С 1 апреля, долбоёб! <span class="emoji">😂</span></div>
  <button id="btn">Простить <span class="emoji">🕊️</span></button>
  <div class="thanks" id="thanks">Спасибо, братан! Ты лучший <span class="emoji">❤️</span></div>

<script>
  document.getElementById('btn').addEventListener('click', () => {
    document.querySelector('h1').style.display = 'none';
    document.querySelector('.april').style.display = 'none';
    document.getElementById('btn').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.textContent = ['🎉','😂','❤️','🎊','🕊️'][Math.floor(Math.random()*5)];
      c.style.position = 'fixed';
      c.style.left = Math.random()*100 + 'vw';
      c.style.top = '-50px';
      c.style.fontSize = (16 + Math.random()*24) + 'px';
      c.style.transition = 'transform 3s linear, opacity 3s';
      c.style.pointerEvents = 'none';
      document.body.appendChild(c);
      requestAnimationFrame(() => {
        c.style.transform = `translateY(${window.innerHeight + 100}px) rotate(${Math.random()*720}deg)`;
        c.style.opacity = '0';
      });
      setTimeout(() => c.remove(), 3200);
    }
  });
</script>
</body>
</html>
